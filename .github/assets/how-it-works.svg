<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" width="900" height="196" role="img" aria-label="How Repotify works: read, ask, pick, install">
<title>How Repotify works: read, ask, pick, install</title>
<style>@font-face{font-family:RPM;src:url(data:font/woff2;base64,) format('woff2');font-weight:100 800}text{font-family:RPM,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-variant-ligatures:none}.n{fill:#3fe8b8;font-weight:700}.t{fill:#fafafa;font-weight:700;font-size:17px}.o{fill:#a1a1a1}</style>
<rect x="10.5" y="30.5" width="196" height="152" rx="10" fill="#0a0a0a" stroke="#262626" stroke-opacity="1"/><text x="28" y="64"><tspan class="n">01</tspan><tspan class="t" dx="10">read</tspan></text><text x="28" y="96" class="o">manifests and</text><text x="28" y="117" class="o">file names only;</text><text x="28" y="138" class="o">code never read</text><path d="M210 105H232" stroke="#3a3a3a" stroke-width="1.5"/><path d="M227 100l6 5-6 5" fill="none" stroke="#6b6b6b" stroke-width="1.5"/><rect x="238.5" y="30.5" width="196" height="152" rx="10" fill="#0a0a0a" stroke="#262626" stroke-opacity="1"/><text x="256" y="64"><tspan class="n">02</tspan><tspan class="t" dx="10">ask</tspan></text><text x="256" y="96" class="o">at most three</text><text x="256" y="117" class="o">questions, only</text><text x="256" y="138" class="o">what it can&#x27;t infer</text><path d="M438 105H460" stroke="#3a3a3a" stroke-width="1.5"/><path d="M455 100l6 5-6 5" fill="none" stroke="#6b6b6b" stroke-width="1.5"/><rect x="466.5" y="30.5" width="196" height="152" rx="10" fill="#0a0a0a" stroke="#262626" stroke-opacity="1"/><text x="484" y="64"><tspan class="n">03</tspan><tspan class="t" dx="10">pick</tspan></text><text x="484" y="96" class="o">one best item per</text><text x="484" y="117" class="o">job, scanned, in</text><text x="484" y="138" class="o">a context budget</text><path d="M666 105H688" stroke="#3a3a3a" stroke-width="1.5"/><path d="M683 100l6 5-6 5" fill="none" stroke="#6b6b6b" stroke-width="1.5"/><rect x="694.5" y="30.5" width="196" height="152" rx="10" fill="#0a0a0a" stroke="#3fe8b8" stroke-opacity="0.6"/><text x="712" y="64"><tspan class="n">04</tspan><tspan class="t" dx="10">install</tspan></text><text x="712" y="96" class="o">pinned commit,</text><text x="712" y="117" class="o">SHA-256 checked,</text><text x="712" y="138" class="o">re-scanned locally</text>
</svg>