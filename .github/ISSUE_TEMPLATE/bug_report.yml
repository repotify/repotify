name: Bug report
description: Something did not work as described.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. For security problems use a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran and, if possible, a small project that shows it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste what Repotify printed. Remove anything private.
      render: text
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Cursor
        - Codex
        - Gemini CLI
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repotify and Node versions
      placeholder: "repotify --version: 0.2.0, node --version: v22.x, macOS 15"
