name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Unit, integration and end-to-end tests
        run: npm test

      - name: Recommendation quality (scenario set)
        run: npm run eval

      - name: Our own skill passes our scanner
        run: node bin/repotify.mjs scan skill/repotify

      - name: Bundled catalog hashes and schema
        run: node pipeline/verify.mjs catalog

      - name: Package contents
        run: npm pack --dry-run

  # Windows and macOS, informative until they are known green: a failure here is reported but does not fail the run.
  compat:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Unit, integration and end-to-end tests
        run: npm test
